<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,viewport-fit=cover" />
        <title>RAUX PLAYER</title>
        <link rel="preconnect" href="https://fonts.googleapis.com/" />
        <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
        <meta name="theme-color" content="dark light" />
        <meta property="og:image" content="https://github.com/muxdigital/xum/raw/feed/img/raux-originals/raux-main.png" />
        <meta property="og:image:type" content="https://github.com/muxdigital/xum/raw/feed/img/raux-originals/raux-main.png" />
        <meta property="og:image:width" content="600" />
        <meta property="og:image:height" content="360" />
        <meta property="og:title" content="RAUX" />
        <meta property="og:description" content="Listen to live radio stations from across the Philippines." />
        <link rel="shortcut icon" href="https://raw.githubusercontent.com/muxdigital/xum/feed/img/raux-originals/raux-icon.png" type="image/x-icon" />

<!-- Plyr CSS CDN -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    
    .player-card {
      background: #1e1e1e;
      padding: 1.25rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      height: 85vh;
      max-height: 680px;
    }

    /* Fixed Top Section */
    .top-section {
      flex-shrink: 0;
    }

    /* Track Metadata & Art Display */
    .station-info {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #282828;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      text-align: left;
    }

    .station-logo {
      width: 60px;
      height: 60px;
      border-radius: 8px;
      object-fit: cover;
      background-color: #333;
      flex-shrink: 0;
    }

    .station-details {
      overflow: hidden;
      width: 100%;
    }

    /* Line 1: Station Name */
    .station-name {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Line 2: Song Title */
    .song-title {
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Line 3: Artist Name */
    .artist-name {
      font-size: 0.85rem;
      color: #00f2fe;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .plyr {
      border-radius: 8px;
      margin-bottom: 12px;
    }
    
    /* Disable seeking progress bar */
    .plyr__progress__container {
      display: none !important;
    }

    /* Vertical Scrollable Station List */
    .station-list-container {
      flex-grow: 1;
      overflow-y: auto;
      background: #282828;
      border-radius: 8px;
      border: 1px solid #333;
      padding: 5px;
      -webkit-overflow-scrolling: touch;
    }

    /* Custom Scrollbar */
    .station-list-container::-webkit-scrollbar {
      width: 5px;
    }
    .station-list-container::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 4px;
    }
    .station-list-container::-webkit-scrollbar-thumb:hover {
      background: #00f2fe;
    }

    .station-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease;
      margin-bottom: 2px;
    }

    .station-item:hover {
      background: #333;
    }

    .station-item:active {
      background: #3a3a3a;
    }

    .station-item.active {
      background: #00f2fe22;
      border-left: 3px solid #00f2fe;
    }

    .item-logo {
      width: 36px;
      height: 36px;
      border-radius: 4px;
      object-fit: cover;
      background-color: #444;
      flex-shrink: 0;
    }

    .item-name {
      font-size: 0.88rem;
      color: #ddd;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .station-item.active .item-name {
      color: #00f2fe;
      font-weight: bold;
    }

    #status {
      margin-top: 8px;
      font-size: 0.75rem;
      color: #666;
      text-align: center;
      flex-shrink: 0;
    }

    /* Mobile Responsiveness */
    @media (max-width: 480px) {
      body {
        padding: 0;
      }

      .player-card {
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
        padding: 1rem;
        box-shadow: none;
      }

      .station-logo {
        width: 52px;
        height: 52px;
      }

      .song-title {
        font-size: 0.95rem;
      }

      .artist-name {
        font-size: 0.8rem;
      }

      .station-item {
        padding: 12px 8px;
      }
      
      .item-logo {
        width: 32px;
        height: 32px;
      }

      .item-name {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

<div class="player-card">
  <!-- Fixed Top Section -->
  <div class="top-section">
    <div class="station-info">
      <!-- Image displays albumArt when fetched, falls back to station logo -->
      <img id="stationLogo" class="station-logo" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='65' height='65' viewBox='0 0 24 24' fill='%23666'><path d='M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z'/></svg>" alt="Album Art / Logo" />
      <div class="station-details">
        <div id="stationName" class="station-name">Station Name</div>
        <div id="songTitle" class="song-title">Select a Station</div>
        <div id="artistName" class="artist-name">---</div>
      </div>
    </div>

    <!-- Audio Player controls: Play, Stop, Current-Time, Mute, Volume -->
    <audio id="player" controls></audio>
  </div>

  <!-- Vertical Scrollable Station List -->
  <div id="stationList" class="station-list-container">
    <div style="padding: 15px; text-align: center; color: #888;">Loading stations...</div>
  </div>

  <div id="status">Loading playlist...</div>
</div>

<!-- Hls.js & Plyr CDN -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

<script>
  const localM3uPath = 'https://raw.githubusercontent.com/muxdigital/xum/feed/audio/raux.m3u';
  const fallbackLogo = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='65' height='65' viewBox='0 0 24 24' fill='%23666'><path d='M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z'/></svg>";

  const listContainer = document.getElementById('stationList');
  const audioElement = document.getElementById('player');
  const statusEl = document.getElementById('status');
  
  const logoEl = document.getElementById('stationLogo');
  const stationNameEl = document.getElementById('stationName');
  const songTitleEl = document.getElementById('songTitle');
  const artistNameEl = document.getElementById('artistName');
  
  let stationsList = [];
  let hlsInstance = null;
  let apiPollInterval = null;
  let currentStationLogo = fallbackLogo;
  
  // Retry Logic State Variables
  let currentStationIndex = null;
  let retryCount = 0;
  const maxRetries = 10;
  let retryTimeout = null;

  const player = new Plyr(audioElement, {
    controls: ['play', 'stop', 'current-time', 'mute', 'volume'],
    tooltips: { controls: true }
  });

  // Handle stream playback errors
  audioElement.addEventListener('error', handlePlaybackError);

  function handlePlaybackError() {
    if (currentStationIndex === null) return;

    if (retryCount < maxRetries) {
      retryCount++;
      statusEl.textContent = `Playback error. Retrying (${retryCount}/${maxRetries})...`;
      
      // Clear previous timeout if any and attempt to reload after 2 seconds
      if (retryTimeout) clearTimeout(retryTimeout);
      retryTimeout = setTimeout(() => {
        playStation(currentStationIndex, true);
      }, 2000);
    } else {
      statusEl.textContent = `Failed to connect after ${maxRetries} attempts. Stream unreachable.`;
      songTitleEl.textContent = 'Playback Failed';
      artistNameEl.textContent = 'Stream unavailable';
      player.stop();
    }
  }

  async function loadPlaylist() {
    try {
      const response = await fetch(localM3uPath);
      if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
      const text = await response.text();
      
      stationsList = parseM3U(text);
      renderStationList(stationsList);
    } catch (err) {
      statusEl.textContent = 'Error: Make sure playlist.m3u exists in the same folder.';
      listContainer.innerHTML = `<div style="padding: 15px; text-align: center; color: #e74c3c;">Failed to load playlist.m3u</div>`;
      console.error(err);
    }
  }

  function parseM3U(content) {
    const lines = content.split(/\r?\n/);
    const stations = [];
    let currentTitle = '';
    let currentLogo = '';

    for (let line of lines) {
      line = line.trim();
      if (line.startsWith('#EXTINF:')) {
        const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
        currentLogo = logoMatch ? logoMatch[1] : '';

        const commaIdx = line.indexOf(',');
        currentTitle = commaIdx !== -1 ? line.substring(commaIdx + 1) : 'Unknown Station';
      } else if (line && !line.startsWith('#')) {
        stations.push({
          title: currentTitle || line,
          logo: currentLogo,
          url: line
        });
        currentTitle = '';
        currentLogo = '';
      }
    }
    return stations;
  }

  function renderStationList(stations) {
    if (stations.length === 0) {
      listContainer.innerHTML = '<div style="padding: 15px; text-align: center; color: #888;">No stations found.</div>';
      statusEl.textContent = 'No stations found in playlist.';
      return;
    }

    listContainer.innerHTML = '';
    stations.forEach((station, index) => {
      const item = document.createElement('div');
      item.className = 'station-item';
      item.dataset.index = index;

      const img = document.createElement('img');
      img.className = 'item-logo';
      img.src = station.logo || fallbackLogo;
      img.onerror = () => { img.src = fallbackLogo; };

      const name = document.createElement('div');
      name.className = 'item-name';
      name.textContent = station.title;

      item.appendChild(img);
      item.appendChild(name);

      item.addEventListener('click', () => playStation(index));
      listContainer.appendChild(item);
    });

    statusEl.textContent = `Loaded ${stations.length} stations.`;
  }

  function getMimeType(url) {
    const cleanUrl = url.split('?')[0].toLowerCase();
    if (cleanUrl.endsWith('.m3u8')) return 'application/x-mpegURL';
    if (cleanUrl.endsWith('.aac') || cleanUrl.endsWith('.aacp')) return 'audio/aac';
    return 'audio/mp3';
  }

  // Fetch track metadata ('song', 'artist', 'albumArt') from custom API endpoint
  async function fetchMetadataFromApi(streamUrl) {
    try {
      const apiUrl = `https://twj.es/?url=${encodeURIComponent(streamUrl)}`;
      const response = await fetch(apiUrl);
      
      if (response.ok) {
        const data = await response.json();
        
        // Update Song Title (replaces "Carregando..." with "Now Playing...")
        if (data.song) {
          const formattedSong = data.song.includes('Carregando...') 
            ? data.song.replace(/Carregando\.\.\./g, 'Now Playing...') 
            : data.song;
          songTitleEl.textContent = formattedSong;
        }

        // Update Artist Name
        if (data.artist) {
          artistNameEl.textContent = data.artist;
        }

        // Update Album Art (replaces station logo image if provided)
        if (data.albumArt) {
          logoEl.src = data.albumArt;
        } else {
          logoEl.src = currentStationLogo;
        }
      }
    } catch (err) {
      console.log('API metadata lookup error:', err);
    }
  }

  function playStation(index, isRetry = false) {
    if (!isRetry) {
      retryCount = 0;
      if (retryTimeout) clearTimeout(retryTimeout);
    }

    if (hlsInstance) {
      hlsInstance.destroy();
      hlsInstance = null;
    }
    if (apiPollInterval) {
      clearInterval(apiPollInterval);
      apiPollInterval = null;
    }

    const items = listContainer.querySelectorAll('.station-item');
    items.forEach(el => el.classList.remove('active'));
    
    if (index === null || index === undefined) {
      currentStationIndex = null;
      player.stop();
      stationNameEl.textContent = 'Station Name';
      songTitleEl.textContent = 'Select a Station';
      artistNameEl.textContent = '---';
      logoEl.src = fallbackLogo;
      return;
    }

    currentStationIndex = index;
    items[index]?.classList.add('active');

    const station = stationsList[index];
    currentStationLogo = station.logo || fallbackLogo;
    
    stationNameEl.textContent = station.title;
    if (!isRetry) {
      songTitleEl.textContent = 'Fetching Track Info...';
      artistNameEl.textContent = 'Live Broadcast';
      statusEl.textContent = `Connecting to ${station.title}...`;
    }
    
    logoEl.src = currentStationLogo;
    logoEl.onerror = () => { logoEl.src = fallbackLogo; };

    const streamUrl = station.url;
    const mimeType = getMimeType(streamUrl);

    // Initial API Fetch and set 10-second polling interval
    fetchMetadataFromApi(streamUrl);
    apiPollInterval = setInterval(() => fetchMetadataFromApi(streamUrl), 10000);

    if (mimeType === 'application/x-mpegURL') {
      if (Hls.isSupported()) {
        hlsInstance = new Hls();
        hlsInstance.loadSource(streamUrl);
        hlsInstance.attachMedia(audioElement);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          player.play().catch(handlePlaybackError);
        });
        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            handlePlaybackError();
          }
        });
      } else if (audioElement.canPlayType('application/vnd.apple.mpegurl')) {
        player.source = { type: 'audio', sources: [{ src: streamUrl, type: 'application/x-mpegURL' }] };
        player.play().catch(handlePlaybackError);
      }
    } else {
      player.source = { type: 'audio', sources: [{ src: streamUrl, type: mimeType }] };
      player.play().catch(handlePlaybackError);
    }
  }

  loadPlaylist();
</script>

</body>
</html>
